<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I love my Asian Honeys</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #500b96;
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffffff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .grid-container {
            display: flex;
            max-width: 850px;
            /*grid-template-columns: auto auto auto auto;*/
            grid-template-rows: auto auto auto auto;
            background-color: #500b96;
            padding: 10px;
            place-items: center;
        }

        h1 {
            color: #000000;
            font-size: 3rem;
            margin-bottom: 10px;
            text-align: center;
            font-weight: 700;
        }
        
        h2 {
            color: #666666;
            font-size: 1.5rem;
            margin-bottom: 40px;
            text-align: center;
            font-weight: 500;
        }
        
        .hero-image {
            width: 100%;
            max-width: 800px;
            margin: 0 auto 40px;
            display: block;
            border-radius: 12px;
            border: 3px solid #000000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        
        .details {
            background: #f5f5f5;
            border: 2px solid #333333;
            border-radius: 12px;
            padding: 30px;
            margin-top: 40px;
        }
        
        .details h3 {
            color: #000000;
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-bottom: 3px solid #333333;
            padding-bottom: 10px;
            font-weight: 600;
        }
        
        .detail-item {
            display: flex;
            padding: 15px 0;
            border-bottom: 1px solid #cccccc;
        }
        
        .detail-item:last-child {
            border-bottom: none;
        }
        
        .detail-label {
            font-weight: 600;
            color: #000000;
            min-width: 200px;
            font-size: 1rem;
        }
        
        .detail-value {
            color: #1a1a1a;
            font-family: 'Courier New', monospace;
            background: white;
            padding: 6px 14px;
            border-radius: 6px;
            border: 2px solid #62596d;
            font-size: 0.95rem;
        }

        .divorganizer {
            display: block;
        }

        .base-position {
            display: flex; /* the parent container is a flexbox so we can center
                              the flexbox used to contain the children */
            justify-content: center; /* Centers content horizontally */
            align-items: center;    /* Centers content vertically */
            max-width: 1000px;
        }

        .boatlife {
            display: block;
            margin: auto;
            border-radius: 8px;
            width: 518px;
            height: 345px;
        }

        .beauty {
            display: block;
            margin: 5px;
            border-radius: 8px;
            width: 250px;
            height: 345px;
        }
        
    </style>
</head>
  <body>
    <div class="container">
        <h1>Oh to have a Bucket List...</h1>
        <h1>Long Live My Gifted Worldly Beauties!</h1>
        <br/>
        <h2>AWS Instance Metadata<br/>
        (featuring a little bit of <b><i>lift</i></b> with a whole lot of <b><i>grit)</i></b></h2>
        
        <!-- <img src=https://upload.wikimedia.org/wikipedia/commons/d/de/Suzy_Bae_at_fansigning_on_February_3%2C_2018_%285%29_%28cropped%29.jpg
        class="beauty"> -->
        <div class="base-position">
            <div class="grid-container">
                <div class="grid-template-rows"><img src="./97df6529c7da7a26e136a1f6f286e1e2.jpg" class="beauty"></div>
                <div class="grid-template-rows"><img src="./98ac436a4fc9e9172f9457810564f408.jpg" class="beauty"></div>
                <div class="grid-template-rows"><img src="./fe7fdcc4aed9bdf1315d562903f88ed2.jpg" class="beauty"></div>
            </div>
        </div>
                <div class="base-position">
            <div class="grid-container">
                <div class="grid-template-rows"><img src="./3540a38d20fd9f8df4d4cf58f82b7357.jpg" class="beauty"></div>
                <div class="grid-template-rows"><img src="./8dca74d03ec966ba76782d47d0aa2270.jpg" class="beauty"></div>
                <div class="grid-template-rows"><img src="./f6373e6aed13f3b70ed8c7517b17cede.jpg" class="beauty"></div>
            </div>
        </div>
        <div class="details">
            <h3>Instance Information</h3>
            <div class="detail-item">
                <span class="detail-label">Instance Name:</span>
                <span class="detail-value">${hostname_value}</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Private IP Address:</span>
                <span class="detail-value">${local_ipv4}</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Availability Zone:</span>
                <span class="detail-value">${az}</span>
            </div>
        </div>
    </div>
</body>
</html>
